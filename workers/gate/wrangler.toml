name = "foundry-gate"
main = "src/index.ts"
compatibility_date = "2026-10-05"

[[artifacts]]
binding = "ARTIFACTS"
namespace = "foundry-dev"

# Event subscription (account-level `artifacts` source → this consumer's
# queue()) is configured via API/dashboard at the Paid spike.
# database_id is a placeholder until `wrangler d1 create foundry-decisions`.
[[d1_databases]]
binding = "DB"
database_name = "foundry-decisions"
database_id = "12e5a5e8-4e87-4ce6-8074-99e393ff9463"

[vars]
# Fallback namespace when an event omits source.namespace.
ARTIFACTS_NS = "foundry-dev"
# K11 Graph Kernel (overlap oracle, verdict triples, plan check) is an
# OPTIONAL integration: set LKG_URL / LKG_TOKEN / PACT_URL via
# `wrangler secret put` (or [vars] for a non-secret URL). Never commit a
# machine-local address here; Workers cannot reach tailnet IPs.

[env.staging]
# A large merge (hundreds of new files hashed and committed in memfs) ran past the 30 s default CPU limit,
# failed three times and was dropped with no decision row (2026-10-22 23:50Z). 5 minutes is the Paid ceiling.
[env.staging.limits]
cpu_ms = 300000
[env.staging.observability]
enabled = true
[env.staging.vars]
ARTIFACTS_NS = "foundry-staging"
[[env.staging.artifacts]]
binding = "ARTIFACTS"
namespace = "foundry-staging"
[[env.staging.d1_databases]]
binding = "DB"
database_name = "foundry-decisions-staging"
database_id = "4dfb279c-4e61-4954-a13a-3e8ef8181484"

[env.production]
[env.production.vars]
ARTIFACTS_NS = "foundry-prod"
[[env.production.artifacts]]
binding = "ARTIFACTS"
namespace = "foundry-prod"
[[env.production.d1_databases]]
binding = "DB"
database_name = "foundry-decisions-prod"
database_id = "21b306b7-c143-4462-9fab-475742907279"

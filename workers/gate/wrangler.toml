name = "foundry-gate"
main = "src/index.ts"
compatibility_date = "2026-10-05"

[[artifacts]]
binding = "ARTIFACTS"
namespace = "foundry-dev"

# Event subscription (account-level `artifacts` source → this consumer's
# queue()) is configured via API/dashboard at the Paid spike.
# database_id is a placeholder until `wrangler d1 create foundry-decisions`.
[[d1_databases]]
binding = "DB"
database_name = "foundry-decisions"
database_id = "12e5a5e8-4e87-4ce6-8074-99e393ff9463"

[vars]
# K11 Graph Kernel (cross-task overlap oracle + verdict triples).
LKG_URL = "http://100.74.32.23:8002"

name = "fleet-signal"
main = "src/index.ts"
compatibility_date = "2026-10-05"

# One hub object per environment (SQLite Durable Object). Not an authority: it
# relays node-signed requests and device-signed decisions; each Mac's
# fleet-authority daemon re-verifies every decision before running anything.
[[durable_objects.bindings]]
name = "HUB"
class_name = "SignalHubObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SignalHubObject"]

# Secrets (wrangler secret put --env <env>, never here):
#   FLEET_SIGNAL_OWNER_SHA256  digest of the owner bearer (scripts/provision.sh)
#   APNS_KEY_P8, APNS_KEY_ID   Apple push key (.p8) once Mohamed creates it
[vars]
FLEET_SIGNAL_ENVIRONMENT = "dev"
APNS_TEAM_ID = "8643C988C4"
APNS_TOPIC = "com.diomande.fabric"

[env.staging]
[[env.staging.durable_objects.bindings]]
name = "HUB"
class_name = "SignalHubObject"
[[env.staging.migrations]]
tag = "v1"
new_sqlite_classes = ["SignalHubObject"]
[env.staging.vars]
FLEET_SIGNAL_ENVIRONMENT = "staging"
APNS_TEAM_ID = "8643C988C4"
APNS_TOPIC = "com.diomande.fabric"

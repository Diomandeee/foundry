name: ci

on:
  push:
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test
        timeout-minutes: 20

  substrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          # This action defaults to RUSTFLAGS="-D warnings", which turned
          # cc-kernel's own `#![warn(missing_docs)]` (and one unused import)
          # into build errors and failed the job before a single test ran.
          # substrate/ is vendored unmodified, so the lint level up here is
          # not ours to raise; the job's contract is to run the suites.
          rustflags: ""

      - name: cc-kernel spec tests
        run: cargo test --manifest-path substrate/cc-kernel/Cargo.toml
        timeout-minutes: 20

      - name: graph-kernel tests
        run: cargo test --manifest-path substrate/live-knowledge-graphs/Cargo.toml
        timeout-minutes: 20

      # Three crates are vendored, so three suites run. This one was missing
      # while its 16 tests passed locally: a vendored system whose tests CI
      # never executes is a system whose drift nobody would notice.
      - name: trajectory-ledger tests
        run: cargo test --manifest-path substrate/trajectory-memory-ledger/Cargo.toml
        timeout-minutes: 20
